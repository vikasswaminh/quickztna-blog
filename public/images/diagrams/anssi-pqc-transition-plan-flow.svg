  <!-- Header Banner -->
  <rect x="0" y="0" width="960" height="68" fill="#0F172A" />
  <rect x="24" y="18" width="182" height="26" rx="5" fill="#6366F1" />
  <text x="115" y="35" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif" letter-spacing="1">REGULATORY ROADMAP</text>
  <text x="232" y="35" fill="#F8FAFC" font-size="16" font-weight="700" font-family="system-ui, sans-serif">ANSSI 3-Phase Post-Quantum Cryptographic Migration</text>
  <text x="232" y="52" fill="#94A3B8" font-size="11.5" font-family="system-ui, sans-serif">French National Cybersecurity Agency (ANSSI) Roadmap for Critical Operators (OIV)</text>
  <line x1="0" y1="68" x2="960" y2="68" stroke="#1E293B" stroke-width="1.5" />
  
      <g transform="translate(60, 140)">
        <rect x="0" y="0" width="200" height="320" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" filter="url(#shadow)" />
        <rect x="0" y="0" width="200" height="42" rx="8" fill="#0284C7" />
        <text x="100" y="18" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">PHASE 1</text>
        <text x="100" y="33" fill="#E0F2FE" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">2022 – 2025</text>

        <text x="14" y="68" fill="#F8FAFC" font-size="12" font-weight="700" font-family="system-ui, sans-serif">Hybrid Deployment &amp; Beta</text>
        <text x="14" y="88" fill="#94A3B8" font-size="9.5" font-family="system-ui, sans-serif">Introduction of post-quantum key exchange alongside classical ECDH algorithms.</text>

        <!-- Requirements Box -->
        <rect x="10" y="115" width="180" height="90" rx="5" fill="#0F172A" stroke="#334155" />
        <text x="18" y="133" fill="#38BDF8" font-size="9.5" font-weight="700" font-family="system-ui, sans-serif">Technical Mandates:</text>
        <text x="18" y="152" fill="#CBD5E1" font-size="8.5" font-family="system-ui, sans-serif">• Deploy hybrid KEM (X25519 + ML-KEM)</text>
        <text x="18" y="172" fill="#CBD5E1" font-size="8.5" font-family="system-ui, sans-serif">• Retain classical ECDH as security backstop</text>
        <text x="18" y="192" fill="#CBD5E1" font-size="8.5" font-family="system-ui, sans-serif">• Prohibit pure post-quantum algorithms</text>

        <!-- Status / Outcome Badge -->
        <rect x="10" y="220" width="180" height="42" rx="5" fill="#1E3A8A" stroke="#3B82F6" />
        <text x="100" y="238" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Transitional Testing</text>
        <text x="100" y="252" fill="#CBD5E1" font-size="8" text-anchor="middle" font-family="system-ui, sans-serif">Lab testing &amp; non-critical OIV pilot links</text>

        <!-- Compliance Target -->
        <rect x="10" y="272" width="180" height="35" rx="5" fill="#18181B" stroke="#475569" />
        <text x="100" y="287" fill="#F59E0B" font-size="8.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Audit Deliverable</text>
        <text x="100" y="300" fill="#E2E8F0" font-size="8" text-anchor="middle" font-family="system-ui, sans-serif">Cryptographic Inventory (CBOM)</text>
      </g>
    
      <g transform="translate(275, 140)">
        <rect x="0" y="0" width="200" height="320" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" filter="url(#shadow)" />
        <rect x="0" y="0" width="200" height="42" rx="8" fill="#0284C7" />
        <text x="100" y="18" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">PHASE 2</text>
        <text x="100" y="33" fill="#E0F2FE" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">2026 – 2030</text>

        <text x="14" y="68" fill="#F8FAFC" font-size="12" font-weight="700" font-family="system-ui, sans-serif">Mandatory Hybridization</text>
        <text x="14" y="88" fill="#94A3B8" font-size="9.5" font-family="system-ui, sans-serif">Hard requirement for all French public administration and critical infrastructure.</text>

        <!-- Requirements Box -->
        <rect x="10" y="115" width="180" height="90" rx="5" fill="#0F172A" stroke="#334155" />
        <text x="18" y="133" fill="#38BDF8" font-size="9.5" font-weight="700" font-family="system-ui, sans-serif">Technical Mandates:</text>
        <text x="18" y="152" fill="#CBD5E1" font-size="8.5" font-family="system-ui, sans-serif">• Enforce hybrid key exchange on all external WANs</text>
        <text x="18" y="172" fill="#CBD5E1" font-size="8.5" font-family="system-ui, sans-serif">• Quantum-safe firmware and software signing</text>
        <text x="18" y="192" fill="#CBD5E1" font-size="8.5" font-family="system-ui, sans-serif">• SecNumCloud &amp; CSPN qualification mandate</text>

        <!-- Status / Outcome Badge -->
        <rect x="10" y="220" width="180" height="42" rx="5" fill="#064E3B" stroke="#059669" />
        <text x="100" y="238" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Mandatory Compliance</text>
        <text x="100" y="252" fill="#CBD5E1" font-size="8" text-anchor="middle" font-family="system-ui, sans-serif">Full enforcement across vital operators</text>

        <!-- Compliance Target -->
        <rect x="10" y="272" width="180" height="35" rx="5" fill="#18181B" stroke="#475569" />
        <text x="100" y="287" fill="#F59E0B" font-size="8.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Audit Deliverable</text>
        <text x="100" y="300" fill="#E2E8F0" font-size="8" text-anchor="middle" font-family="system-ui, sans-serif">Audited Hybrid WireGuard/TLS Configs</text>
      </g>
    
      <g transform="translate(490, 140)">
        <rect x="0" y="0" width="200" height="320" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" filter="url(#shadow)" />
        <rect x="0" y="0" width="200" height="42" rx="8" fill="#0284C7" />
        <text x="100" y="18" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">PHASE 3</text>
        <text x="100" y="33" fill="#E0F2FE" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">2030+</text>

        <text x="14" y="68" fill="#F8FAFC" font-size="12" font-weight="700" font-family="system-ui, sans-serif">Pure Post-Quantum Sunset</text>
        <text x="14" y="88" fill="#94A3B8" font-size="9.5" font-family="system-ui, sans-serif">Classical cryptography deprecated. Full transition to standalone PQC primitives.</text>

        <!-- Requirements Box -->
        <rect x="10" y="115" width="180" height="90" rx="5" fill="#0F172A" stroke="#334155" />
        <text x="18" y="133" fill="#38BDF8" font-size="9.5" font-weight="700" font-family="system-ui, sans-serif">Technical Mandates:</text>
        <text x="18" y="152" fill="#CBD5E1" font-size="8.5" font-family="system-ui, sans-serif">• Complete sunset of RSA, DH, and ECC</text>
        <text x="18" y="172" fill="#CBD5E1" font-size="8.5" font-family="system-ui, sans-serif">• FIPS 203/204 algorithms (ML-KEM / ML-DSA)</text>
        <text x="18" y="192" fill="#CBD5E1" font-size="8.5" font-family="system-ui, sans-serif">• Pure PQC permitted for qualified equipment</text>

        <!-- Status / Outcome Badge -->
        <rect x="10" y="220" width="180" height="42" rx="5" fill="#4C1D95" stroke="#8B5CF6" />
        <text x="100" y="238" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Full PQC Era</text>
        <text x="100" y="252" fill="#CBD5E1" font-size="8" text-anchor="middle" font-family="system-ui, sans-serif">Complete classical deprecation across France</text>

        <!-- Compliance Target -->
        <rect x="10" y="272" width="180" height="35" rx="5" fill="#18181B" stroke="#475569" />
        <text x="100" y="287" fill="#F59E0B" font-size="8.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Audit Deliverable</text>
        <text x="100" y="300" fill="#E2E8F0" font-size="8" text-anchor="middle" font-family="system-ui, sans-serif">National Quantum Defense Certificate</text>
      </g>
    
  <!-- Footer -->
  <line x1="20" y1="552" x2="940" y2="552" stroke="#1E293B" stroke-width="1" />
