        <text x="38" y="44" fill="#94A3B8" font-size="10" font-family="system-ui, sans-serif">Continuous socket inspection drains 40%+ laptop battery.</text>
        <text x="38" y="58" fill="#64748B" font-size="9.5" font-family="system-ui, sans-serif">Context switching between user space and kernel throttles speed.</text>
      </g>
    

