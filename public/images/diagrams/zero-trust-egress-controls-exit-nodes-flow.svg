        <text x="38" y="44" fill="#94A3B8" font-size="10" font-family="system-ui, sans-serif">Breaks developer tools (Docker, Pip, Cargo, Git).</text>
        <text x="38" y="58" fill="#64748B" font-size="9.5" font-family="system-ui, sans-serif">Intercepts and decrypts TLS with high latency.</text>
      </g>
    
      <g transform="translate(60, 235)">
