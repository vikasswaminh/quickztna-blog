        <text x="38" y="44" fill="#94A3B8" font-size="10" font-family="system-ui, sans-serif">80–150ms backhaul latency through central datacenters.</text>
        <text x="38" y="58" fill="#64748B" font-size="9.5" font-family="system-ui, sans-serif">Concentrator saturates under commodity streaming.</text>
