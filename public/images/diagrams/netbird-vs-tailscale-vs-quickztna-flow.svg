        <text x="38" y="44" fill="#94A3B8" font-size="10" font-family="system-ui, sans-serif">Simple OS version and client verification.</text>
        <text x="38" y="58" fill="#64748B" font-size="9.5" font-family="system-ui, sans-serif">Limited real-time integration with corporate EDRs.</text>
      </g>
    
      <g transform="translate(60, 320)">
