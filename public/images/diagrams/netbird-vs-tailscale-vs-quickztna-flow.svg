  <text x="268" y="35" fill="#F8FAFC" font-size="16" font-weight="700" font-family="system-ui, sans-serif">Tailscale vs. NetBird vs. QuickZTNA Architecture</text>
  <text x="268" y="52" fill="#94A3B8" font-size="11.5" font-family="system-ui, sans-serif">3-Way Technical Comparison: Proprietary vs Open Source vs Enterprise Governance</text>
