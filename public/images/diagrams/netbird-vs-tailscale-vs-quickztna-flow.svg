        <text x="38" y="44" fill="#94A3B8" font-size="10" font-family="system-ui, sans-serif">VPN, ZTNA gateway, and compliance purchased separately.</text>
        <text x="38" y="58" fill="#64748B" font-size="9.5" font-family="system-ui, sans-serif">Fragmented admin dashboards for security teams.</text>
      </g>
    

    <!-- Central VS Badge -->
