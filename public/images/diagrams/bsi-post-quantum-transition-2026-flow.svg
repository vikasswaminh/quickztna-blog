  <!-- Header Banner -->
  <rect x="0" y="0" width="960" height="68" fill="#0F172A" />
  <rect x="24" y="18" width="137" height="26" rx="5" fill="#059669" />
  <text x="92.5" y="35" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif" letter-spacing="1">DECISION TREE</text>
  <text x="187" y="35" fill="#F8FAFC" font-size="16" font-weight="700" font-family="system-ui, sans-serif">German BSI TR-02102-1 Compliance Flowchart</text>
  <text x="187" y="52" fill="#94A3B8" font-size="11.5" font-family="system-ui, sans-serif">Cryptographic Algorithm Selection &amp; Hybrid Mandates for KRITIS Operators</text>
  <line x1="0" y1="68" x2="960" y2="68" stroke="#1E293B" stroke-width="1.5" />
  
      <!-- Stage 1 -->
      <g transform="translate(40, 130)">
        <rect x="0" y="0" width="190" height="280" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" filter="url(#shadow)" />
        <rect x="0" y="0" width="190" height="32" rx="8" fill="#0284C7" />
        <text x="95" y="20" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">STAGE 1: ASSET SCOPE</text>
        
        <text x="12" y="55" fill="#F8FAFC" font-size="11.5" font-weight="700" font-family="system-ui, sans-serif">KRITIS / NIS2 Scope</text>
        <text x="12" y="75" fill="#94A3B8" font-size="9.5" font-family="system-ui, sans-serif">Identifies whether workload belongs to German vital infrastructure.</text>

        <!-- Evaluation Condition -->
        <rect x="10" y="95" width="170" height="65" rx="5" fill="#0F172A" stroke="#334155" />
        <text x="95" y="114" fill="#38BDF8" font-size="9" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Evaluation Criterion:</text>
        <text x="16" y="132" fill="#E2E8F0" font-size="8.5" font-family="system-ui, sans-serif">• Energy, Water, Finance, Gov</text>
        <text x="16" y="148" fill="#E2E8F0" font-size="8.5" font-family="system-ui, sans-serif">• Data retention horizon &gt;= 5 years</text>

        <!-- Success Outcome -->
        <rect x="10" y="170" width="170" height="45" rx="5" fill="#064E3B" stroke="#059669" fill-opacity="0.4" />
        <text x="16" y="188" fill="#6EE7B7" font-size="9" font-weight="700" font-family="system-ui, sans-serif">✓ PASS</text>
        <text x="16" y="204" fill="#A7F3D0" font-size="8.5" font-family="system-ui, sans-serif">Proceed to PQC Mandate</text>

        <!-- Failure Outcome -->
        <rect x="10" y="222" width="170" height="45" rx="5" fill="#450A0A" stroke="#EF4444" fill-opacity="0.4" />
        <text x="16" y="240" fill="#FCA5A5" font-size="9" font-weight="700" font-family="system-ui, sans-serif">✕ FAIL</text>
        <text x="16" y="256" fill="#FECACA" font-size="8.5" font-family="system-ui, sans-serif">Standard Baseline</text>
      </g>
    
        <line x1="230" y1="322" x2="275" y2="322" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)" />
      
      <!-- Stage 2 -->
      <g transform="translate(275, 130)">
        <rect x="0" y="0" width="190" height="280" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)" />
        <rect x="0" y="0" width="190" height="32" rx="8" fill="#059669" />
        <text x="95" y="20" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">STAGE 2: KEM ALGORITHM</text>
        
        <text x="12" y="55" fill="#F8FAFC" font-size="11.5" font-weight="700" font-family="system-ui, sans-serif">FrodoKEM / ML-KEM</text>
        <text x="12" y="75" fill="#94A3B8" font-size="9.5" font-family="system-ui, sans-serif">Evaluates algorithm hardness against BSI approved specifications.</text>

        <!-- Evaluation Condition -->
        <rect x="10" y="95" width="170" height="65" rx="5" fill="#0F172A" stroke="#334155" />
        <text x="95" y="114" fill="#38BDF8" font-size="9" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Evaluation Criterion:</text>
        <text x="16" y="132" fill="#E2E8F0" font-size="8.5" font-family="system-ui, sans-serif">• FrodoKEM (Unstructured Lattice)</text>
        <text x="16" y="148" fill="#E2E8F0" font-size="8.5" font-family="system-ui, sans-serif">• ML-KEM / Kyber (FIPS 203)</text>

        <!-- Success Outcome -->
        <rect x="10" y="170" width="170" height="45" rx="5" fill="#064E3B" stroke="#059669" fill-opacity="0.4" />
        <text x="16" y="188" fill="#6EE7B7" font-size="9" font-weight="700" font-family="system-ui, sans-serif">✓ PASS</text>
        <text x="16" y="204" fill="#A7F3D0" font-size="8.5" font-family="system-ui, sans-serif">Algorithm Approved</text>

        <!-- Failure Outcome -->
        <rect x="10" y="222" width="170" height="45" rx="5" fill="#450A0A" stroke="#EF4444" fill-opacity="0.4" />
        <text x="16" y="240" fill="#FCA5A5" font-size="9" font-weight="700" font-family="system-ui, sans-serif">✕ FAIL</text>
        <text x="16" y="256" fill="#FECACA" font-size="8.5" font-family="system-ui, sans-serif">Non-Compliant Primitive</text>
      </g>
    
        <line x1="465" y1="322" x2="510" y2="322" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)" />
      
      <!-- Stage 3 -->
      <g transform="translate(510, 130)">
        <rect x="0" y="0" width="190" height="280" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow)" />
        <rect x="0" y="0" width="190" height="32" rx="8" fill="#D97706" />
        <text x="95" y="20" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">STAGE 3: HYBRIDIZATION</text>
        
        <text x="12" y="55" fill="#F8FAFC" font-size="11.5" font-weight="700" font-family="system-ui, sans-serif">Classical ECDH Combiner</text>
        <text x="12" y="75" fill="#94A3B8" font-size="9.5" font-family="system-ui, sans-serif">Validates that post-quantum KEM is combined with Curve25519/Brainpool.</text>

        <!-- Evaluation Condition -->
        <rect x="10" y="95" width="170" height="65" rx="5" fill="#0F172A" stroke="#334155" />
        <text x="95" y="114" fill="#38BDF8" font-size="9" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Evaluation Criterion:</text>
        <text x="16" y="132" fill="#E2E8F0" font-size="8.5" font-family="system-ui, sans-serif">• HKDF-SHA256 dual derivation</text>
        <text x="16" y="148" fill="#E2E8F0" font-size="8.5" font-family="system-ui, sans-serif">• Zero single-algorithm point of failure</text>

        <!-- Success Outcome -->
        <rect x="10" y="170" width="170" height="45" rx="5" fill="#064E3B" stroke="#059669" fill-opacity="0.4" />
        <text x="16" y="188" fill="#6EE7B7" font-size="9" font-weight="700" font-family="system-ui, sans-serif">✓ PASS</text>
        <text x="16" y="204" fill="#A7F3D0" font-size="8.5" font-family="system-ui, sans-serif">BSI TR-02102 Certified</text>

        <!-- Failure Outcome -->
        <rect x="10" y="222" width="170" height="45" rx="5" fill="#450A0A" stroke="#EF4444" fill-opacity="0.4" />
        <text x="16" y="240" fill="#FCA5A5" font-size="9" font-weight="700" font-family="system-ui, sans-serif">✕ FAIL</text>
        <text x="16" y="256" fill="#FECACA" font-size="8.5" font-family="system-ui, sans-serif">Standalone PQC Rejected</text>
      </g>
    
    <g transform="translate(60, 445)">
      <rect x="0" y="0" width="840" height="70" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
      <text x="24" y="28" fill="#F59E0B" font-size="11" font-weight="700" font-family="system-ui, sans-serif">⚡ Continuous Re-Evaluation Axiom:</text>
      <text x="24" y="48" fill="#94A3B8" font-size="10" font-family="system-ui, sans-serif">Policies are not static login checkpoints. If any posture metric or token claim degrades during an active session, keys are evicted instantly.</text>
    </g>
  
  <!-- Footer -->
  <line x1="20" y1="552" x2="940" y2="552" stroke="#1E293B" stroke-width="1" />
  <text x="24" y="568" fill="#64748B" font-size="10" font-family="system-ui, sans-serif">QuickZTNA Technical Architecture Reference</text>
  <text x="936" y="568" fill="#38BDF8" font-size="10" font-weight="600" text-anchor="end" font-family="system-ui, sans-serif">Zero Trust Verified Blueprint</text>
</svg>
  