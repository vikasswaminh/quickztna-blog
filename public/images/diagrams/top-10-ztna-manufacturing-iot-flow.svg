      <text x="420" y="235" fill="#FCA5A5" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">🚫 STRICT AIR-GAP: Zero Layer 3 Subnet Cross-Routing to Plant Floor</text>

