
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="auto" style="background:#0B1120;border-radius:12px;border:1px solid #1E293B;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06B6D4" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F43F5E" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Header Banner -->
  <rect x="0" y="0" width="960" height="68" fill="#0F172A" />
  <rect x="24" y="18" width="164" height="26" rx="5" fill="#8B5CF6" />
  <text x="106" y="35" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif" letter-spacing="1">DEFENSE IN DEPTH</text>
  <text x="214" y="35" fill="#F8FAFC" font-size="16" font-weight="700" font-family="system-ui, sans-serif">SOC 2 Type II Remote Access Trust Services Criteria Fabric</text>
  <text x="214" y="52" fill="#94A3B8" font-size="11.5" font-family="system-ui, sans-serif">Continuous Compliance Mapping: CC6.1, CC6.6, and CC7.2 Evidence Generation</text>
  <line x1="0" y1="68" x2="960" y2="68" stroke="#1E293B" stroke-width="1.5" />
  
      <g transform="translate(70, 105)">
        <rect x="0" y="0" width="820" height="80" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" filter="url(#shadow)" />
        <rect x="0" y="0" width="130" height="80" rx="8" fill="#0284C7" />
        <text x="65" y="35" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">CRITERION 1</text>
        <text x="65" y="52" fill="#E0F2FE" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">CC6.1: Logical Access</text>

        <text x="150" y="28" fill="#F8FAFC" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Identity-Bound Least Privilege (ABAC)</text>
        <text x="150" y="48" fill="#94A3B8" font-size="10" font-family="system-ui, sans-serif">Enforces role-based and attribute-based access control; standing superuser accounts replaced by JIT.</text>
        <text x="150" y="65" fill="#38BDF8" font-size="9.5" font-weight="600" font-family="system-ui, sans-serif">Enforced Controls: SSO/SCIM integration, Just-In-Time role elevation with dual approvals</text>
      </g>
    
      <g transform="translate(70, 200)">
        <rect x="0" y="0" width="820" height="80" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)" />
        <rect x="0" y="0" width="130" height="80" rx="8" fill="#059669" />
        <text x="65" y="35" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">CRITERION 2</text>
        <text x="65" y="52" fill="#E0F2FE" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">CC6.6: Boundary</text>

        <text x="150" y="28" fill="#F8FAFC" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Perimeter Elimination &amp; Dark Infrastructure</text>
        <text x="150" y="48" fill="#94A3B8" font-size="10" font-family="system-ui, sans-serif">Eliminates open listening ports on internet gateways; restricts access to explicit microtunnels.</text>
        <text x="150" y="65" fill="#10B981" font-size="9.5" font-weight="600" font-family="system-ui, sans-serif">Enforced Controls: Single-Packet Authorization, zero inbound open firewall ports, peer isolation</text>
      </g>
    
      <g transform="translate(70, 295)">
        <rect x="0" y="0" width="820" height="80" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow)" />
        <rect x="0" y="0" width="130" height="80" rx="8" fill="#D97706" />
        <text x="65" y="35" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">CRITERION 3</text>
        <text x="65" y="52" fill="#E0F2FE" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">CC6.7: Encryption</text>

        <text x="150" y="28" fill="#F8FAFC" font-size="13" font-weight="700" font-family="system-ui, sans-serif">End-to-End Cryptographic Data Protection</text>
        <text x="150" y="48" fill="#94A3B8" font-size="10" font-family="system-ui, sans-serif">Encrypts all remote access data in transit using state-of-the-art cryptographic primitives.</text>
        <text x="150" y="65" fill="#F59E0B" font-size="9.5" font-weight="600" font-family="system-ui, sans-serif">Enforced Controls: WireGuard ChaCha20-Poly1305, ephemeral key rotation with sub-hourly shredding</text>
      </g>
    
      <g transform="translate(70, 390)">
        <rect x="0" y="0" width="820" height="80" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1.5" filter="url(#shadow)" />
        <rect x="0" y="0" width="130" height="80" rx="8" fill="#7E22CE" />
        <text x="65" y="35" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">CRITERION 4</text>
        <text x="65" y="52" fill="#E0F2FE" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">CC7.2: Monitoring</text>

        <text x="150" y="28" fill="#F8FAFC" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Automated Auditor Evidence Pipeline</text>
        <text x="150" y="48" fill="#94A3B8" font-size="10" font-family="system-ui, sans-serif">Produces tamper-evident, structured logs proving that policies were continuously enforced.</text>
        <text x="150" y="65" fill="#A855F7" font-size="9.5" font-weight="600" font-family="system-ui, sans-serif">Enforced Controls: One-click auditor CSV/JSON export, cryptographic hash chains, SIEM sync</text>
      </g>
    
  <!-- Footer -->
  <line x1="20" y1="552" x2="940" y2="552" stroke="#1E293B" stroke-width="1" />
  <text x="24" y="568" fill="#64748B" font-size="10" font-family="system-ui, sans-serif">QuickZTNA Technical Architecture Reference</text>
  <text x="936" y="568" fill="#38BDF8" font-size="10" font-weight="600" text-anchor="end" font-family="system-ui, sans-serif">Zero Trust Verified Blueprint</text>
</svg>
  