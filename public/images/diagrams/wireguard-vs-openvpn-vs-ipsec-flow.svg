
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="auto" style="background:#0B1120;border-radius:12px;border:1px solid #1E293B;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06B6D4" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F43F5E" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Header Banner -->
  <rect x="0" y="0" width="960" height="68" fill="#0F172A" />
  <rect x="24" y="18" width="209" height="26" rx="5" fill="#F59E0B" />
  <text x="128.5" y="35" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif" letter-spacing="1">PERFORMANCE BENCHMARK</text>
  <text x="259" y="35" fill="#F8FAFC" font-size="16" font-weight="700" font-family="system-ui, sans-serif">VPN Protocols Compared: Codebase Complexity &amp; Performance</text>
  <text x="259" y="52" fill="#94A3B8" font-size="11.5" font-family="system-ui, sans-serif">Lines of Code (LOC) Auditable Surface vs Throughput Efficiency (Gbps)</text>
  <line x1="0" y1="68" x2="960" y2="68" stroke="#1E293B" stroke-width="1.5" />
  
    <rect x="80" y="95" width="800" height="380" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    <text x="100" y="115" fill="#38BDF8" font-size="12" font-weight="700" font-family="system-ui, sans-serif">Protocol Codebase Size (Lines of Code - Lower is Safer)</text>
    <line x1="260" y1="130" x2="260" y2="460" stroke="#334155" stroke-width="1.5" />
    
      <!-- Bar 1 -->
      <text x="250" y="157" fill="#F8FAFC" font-size="12" font-weight="700" text-anchor="end" font-family="system-ui, sans-serif">IPsec (IKEv2 Stack)</text>
      <text x="250" y="171" fill="#94A3B8" font-size="9" text-anchor="end" font-family="system-ui, sans-serif">StrongSwan / Kernel IPsec</text>

      <rect x="265" y="143" width="480" height="28" rx="4" fill="#EF4444" filter="url(#shadow)" />
      <text x="755" y="162" fill="#FFFFFF" font-size="11" font-weight="700" font-family="system-ui, sans-serif">400,000 LOC</text>

      
    
      <!-- Bar 2 -->
      <text x="250" y="270.3333333333333" fill="#F8FAFC" font-size="12" font-weight="700" text-anchor="end" font-family="system-ui, sans-serif">OpenVPN Daemon</text>
      <text x="250" y="284.3333333333333" fill="#94A3B8" font-size="9" text-anchor="end" font-family="system-ui, sans-serif">OpenVPN + OpenSSL Dependency</text>

      <rect x="265" y="256.3333333333333" width="144" height="28" rx="4" fill="#F59E0B" filter="url(#shadow)" />
      <text x="419" y="275.3333333333333" fill="#FFFFFF" font-size="11" font-weight="700" font-family="system-ui, sans-serif">120,000 LOC</text>

      
    
      <!-- Bar 3 -->
      <text x="250" y="383.66666666666663" fill="#F8FAFC" font-size="12" font-weight="700" text-anchor="end" font-family="system-ui, sans-serif">WireGuard Kernel Driver</text>
      <text x="250" y="397.66666666666663" fill="#94A3B8" font-size="9" text-anchor="end" font-family="system-ui, sans-serif">Clean In-Kernel Implementation</text>

      <rect x="265" y="369.66666666666663" width="4.8" height="28" rx="4" fill="#10B981" filter="url(#shadow)" />
      <text x="279.8" y="388.66666666666663" fill="#FFFFFF" font-size="11" font-weight="700" font-family="system-ui, sans-serif">4,000 LOC</text>

      
        <rect x="394.8" y="372.66666666666663" width="80" height="20" rx="3" fill="#064E3B" stroke="#10B981" />
        <text x="434.8" y="385.66666666666663" fill="#6EE7B7" font-size="9" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">⚡ 99% Less Code</text>
      
    
  
  <!-- Footer -->
  <line x1="20" y1="552" x2="940" y2="552" stroke="#1E293B" stroke-width="1" />
  <text x="24" y="568" fill="#64748B" font-size="10" font-family="system-ui, sans-serif">QuickZTNA Technical Architecture Reference</text>
  <text x="936" y="568" fill="#38BDF8" font-size="10" font-weight="600" text-anchor="end" font-family="system-ui, sans-serif">Zero Trust Verified Blueprint</text>
</svg>
  