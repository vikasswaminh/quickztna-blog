
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="auto" style="background:#0B1120;border-radius:12px;border:1px solid #1E293B;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06B6D4" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F43F5E" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Header Banner -->
  <rect x="0" y="0" width="960" height="68" fill="#0F172A" />
  <rect x="24" y="18" width="209" height="26" rx="5" fill="#F59E0B" />
  <text x="128.5" y="35" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif" letter-spacing="1">PERFORMANCE BENCHMARK</text>
  <text x="259" y="35" fill="#F8FAFC" font-size="16" font-weight="700" font-family="system-ui, sans-serif">ML-KEM-768 (FIPS 203) Cryptographic Wire Size Budget</text>
  <text x="259" y="52" fill="#94A3B8" font-size="11.5" font-family="system-ui, sans-serif">Byte Size Comparison: Public Key, Ciphertext, and Secret vs Classical X25519</text>
  <line x1="0" y1="68" x2="960" y2="68" stroke="#1E293B" stroke-width="1.5" />
  
    <rect x="80" y="95" width="800" height="380" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    <text x="100" y="115" fill="#38BDF8" font-size="12" font-weight="700" font-family="system-ui, sans-serif">Cryptographic Material Size on Wire (Bytes)</text>
    <line x1="260" y1="130" x2="260" y2="460" stroke="#334155" stroke-width="1.5" />
    
      <!-- Bar 1 -->
      <text x="250" y="157" fill="#F8FAFC" font-size="12" font-weight="700" text-anchor="end" font-family="system-ui, sans-serif">ML-KEM Secret Key</text>
      <text x="250" y="171" fill="#94A3B8" font-size="9" text-anchor="end" font-family="system-ui, sans-serif">Private Decapsulation Key (sk)</text>

      <rect x="265" y="143" width="480" height="28" rx="4" fill="#8B5CF6" filter="url(#shadow)" />
      <text x="755" y="162" fill="#FFFFFF" font-size="11" font-weight="700" font-family="system-ui, sans-serif">2,400 Bytes</text>

      
    
      <!-- Bar 2 -->
      <text x="250" y="225" fill="#F8FAFC" font-size="12" font-weight="700" text-anchor="end" font-family="system-ui, sans-serif">ML-KEM Public Key</text>
      <text x="250" y="239" fill="#94A3B8" font-size="9" text-anchor="end" font-family="system-ui, sans-serif">Client Public Encapsulation Key (pk)</text>

      <rect x="265" y="211" width="236.8" height="28" rx="4" fill="#0284C7" filter="url(#shadow)" />
      <text x="511.8" y="230" fill="#FFFFFF" font-size="11" font-weight="700" font-family="system-ui, sans-serif">1,184 Bytes</text>

      
    
      <!-- Bar 3 -->
      <text x="250" y="293" fill="#F8FAFC" font-size="12" font-weight="700" text-anchor="end" font-family="system-ui, sans-serif">ML-KEM Ciphertext</text>
      <text x="250" y="307" fill="#94A3B8" font-size="9" text-anchor="end" font-family="system-ui, sans-serif">Encapsulated Ciphertext Payload (ct)</text>

      <rect x="265" y="279" width="217.6" height="28" rx="4" fill="#F59E0B" filter="url(#shadow)" />
      <text x="492.6" y="298" fill="#FFFFFF" font-size="11" font-weight="700" font-family="system-ui, sans-serif">1,088 Bytes</text>

      
    
      <!-- Bar 4 -->
      <text x="250" y="361" fill="#F8FAFC" font-size="12" font-weight="700" text-anchor="end" font-family="system-ui, sans-serif">ML-KEM Shared Secret</text>
      <text x="250" y="375" fill="#94A3B8" font-size="9" text-anchor="end" font-family="system-ui, sans-serif">Derived Symmetric Entropy (K)</text>

      <rect x="265" y="347" width="6.4" height="28" rx="4" fill="#10B981" filter="url(#shadow)" />
      <text x="281.4" y="366" fill="#FFFFFF" font-size="11" font-weight="700" font-family="system-ui, sans-serif">32 Bytes</text>

      
        <rect x="396.4" y="350" width="80" height="20" rx="3" fill="#064E3B" stroke="#10B981" />
        <text x="436.4" y="363" fill="#6EE7B7" font-size="9" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">⚡ AES-192 Strength</text>
      
    
      <!-- Bar 5 -->
      <text x="250" y="429" fill="#F8FAFC" font-size="12" font-weight="700" text-anchor="end" font-family="system-ui, sans-serif">Classical X25519 Key</text>
      <text x="250" y="443" fill="#94A3B8" font-size="9" text-anchor="end" font-family="system-ui, sans-serif">Standard Curve25519 Public Key</text>

      <rect x="265" y="415" width="6.4" height="28" rx="4" fill="#64748B" filter="url(#shadow)" />
      <text x="281.4" y="434" fill="#FFFFFF" font-size="11" font-weight="700" font-family="system-ui, sans-serif">32 Bytes</text>

      
    
  
  <!-- Footer -->
  <line x1="20" y1="552" x2="940" y2="552" stroke="#1E293B" stroke-width="1" />
  <text x="24" y="568" fill="#64748B" font-size="10" font-family="system-ui, sans-serif">QuickZTNA Technical Architecture Reference</text>
  <text x="936" y="568" fill="#38BDF8" font-size="10" font-weight="600" text-anchor="end" font-family="system-ui, sans-serif">Zero Trust Verified Blueprint</text>
</svg>
  